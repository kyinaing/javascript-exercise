<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2 Ways Not to add event listeners</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div>
      <h1>This is a box</h1>
      <button onclick="alert('You Click Me')">Click Me!</button>
      <button onmouseover="alert('You Over Me')">Mouse Over!</button>
      <button id="clickMe">Click Me!</button>
      <button id="clicker">Kick Out!</button>
      <form action="">
        <input type="range" min="10" max="50" />
      </form>
    </div>
    <h1 id="h1Color">Pick a Color</h1>
    <section id="boxes"></section>
    <section id="shopping">
      <div>
        <h1>Shopping List</h1>
        <input id="addItem" type="text" placeholder="Enter your list" />
      </div>
      <div>
        <ul id="items"></ul>
      </div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
